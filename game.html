<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Arcas do Hábito</title>
    <meta name="description" content="A 3DeT Victory pixel-art game where habits level up the hero." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Patrick+Hand&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/ink.css" />
    <link rel="stylesheet" href="css/game.css" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23fff'/%3E%3Crect x='3' y='3' width='26' height='26' fill='none' stroke='%23000' stroke-width='4'/%3E%3Cpath d='M9 16l5 5 9-11' fill='none' stroke='%23000' stroke-width='4'/%3E%3C/svg%3E"
    />
  </head>
  <body>
    <div class="speed-lines" aria-hidden="true"></div>

    <header class="masthead panel game-masthead">
      <h1 class="masthead-title" data-game-i18n="gameTitle">ARCAS DO HÁBITO</h1>
      <p class="masthead-tagline" data-game-i18n="gameTagline">A 3DeT Victory campaign where the hero is you.</p>
      <div class="masthead-tools">
        <a class="stamp" href="index.html" data-game-i18n="backToList">List</a>
        <button type="button" class="stamp" id="sound-toggle" aria-label="Sound">🔊</button>
        <button type="button" class="stamp" id="lang-toggle" aria-label="Toggle language">PT</button>
      </div>
    </header>

    <main class="page game-page">
      <aside class="panel hero-panel" id="hero-panel" aria-label="Hero"></aside>
      <section class="game-content">
        <nav class="game-tabs" aria-label="Game sections">
          <button type="button" class="tab" data-tab="today" data-game-i18n="tabToday">Today</button>
          <button type="button" class="tab" data-tab="sheet" data-game-i18n="tabSheet">Sheet</button>
          <button type="button" class="tab" data-tab="stages" data-game-i18n="tabStages">Arcas</button>
          <button type="button" class="tab" data-tab="battle" data-game-i18n="tabBattle">Adventure</button>
        </nav>
        <p class="game-notice form-error" id="game-notice" role="status" hidden></p>
        <div id="game-main"></div>
      </section>
    </main>

    <footer class="colophon">3DeT Victory © Jambô Editora. Fan game, personal use.</footer>

    <script type="module" src="js/game/game-app.js"></script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Habits</title>
    <meta
      name="description"
      content="A black-and-white ink style list of things to read, watch, build and keep up with."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Patrick+Hand&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/ink.css" />
    <link rel="stylesheet" href="css/game.css" />
    <link rel="stylesheet" href="css/pomodoro.css" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23fff'/%3E%3Crect x='3' y='3' width='26' height='26' fill='none' stroke='%23000' stroke-width='4'/%3E%3Cpath d='M9 16l5 5 9-11' fill='none' stroke='%23000' stroke-width='4'/%3E%3C/svg%3E"
    />
  </head>
  <body>
    <div class="speed-lines" aria-hidden="true"></div>

    <header class="masthead panel">
      <h1 class="masthead-title" data-i18n="title">HABITS</h1>
      <p class="masthead-tagline" data-i18n="tagline">Chapter by chapter, one habit at a time.</p>
      <div class="masthead-tools">
        <a class="stamp" href="game.html" data-i18n="play">Play</a>
        <a class="stamp" href="puzzle.html" data-i18n="puzzles">Puzzles</a>
        <button type="button" class="stamp" id="sync-toggle" data-i18n="syncButton" aria-expanded="false">Sync</button>
        <button type="button" class="stamp" id="sound-toggle" aria-label="Sound">🔊</button>
        <button type="button" class="stamp" id="lang-toggle" aria-label="Toggle language">PT</button>
        <button type="button" class="stamp" id="export-button" data-i18n="export">Export</button>
        <label class="stamp" for="import-input" data-i18n="import">Import</label>
        <input type="file" id="import-input" accept="application/json" hidden />
        <button type="button" class="stamp stamp-danger" id="reset-button" data-i18n="reset">Reset to sheet</button>
      </div>
    </header>

    <section class="pomodoro-wrap">
      <div class="panel sync-panel" id="sync-panel" aria-labelledby="sync-title" hidden>
        <h2 id="sync-title" class="panel-title" data-i18n="syncTitle">Google Sheets sync</h2>
        <p class="muted" data-i18n="syncHelp">
          Deploy sheets-sync/Code.gs as a web app (see the README) and paste its URL and secret word.
        </p>
        <form class="sync-form" data-form="sync">
          <label class="field"
            ><span data-i18n="syncUrl">Web app URL</span>
            <input type="url" name="url" placeholder="https://script.google.com/macros/s/…/exec" autocomplete="off"
          /></label>
          <label class="field"
            ><span data-i18n="syncToken">Secret word</span> <input type="password" name="token" autocomplete="off"
          /></label>
          <div class="sync-actions">
            <button type="submit" class="stamp" data-i18n="syncSave">Save</button>
            <button type="button" class="stamp" data-sync="now" data-i18n="syncNow">Sync now</button>
            <button type="button" class="stamp stamp-danger" data-sync="disconnect" data-i18n="syncDisconnect">
              Disconnect
            </button>
          </div>
        </form>
        <p class="sync-status" data-sync-status></p>
      </div>
      <div class="panel pomodoro-panel" aria-labelledby="pomodoro-title">
        <h2 id="pomodoro-title" class="panel-title" data-pomodoro-i18n="pomodoroTitle">Pomodoro</h2>
        <div id="pomodoro-body"></div>
        <div class="pomodoro-video" id="pomodoro-video"></div>
      </div>
    </section>

    <main class="page home-page">
      <aside class="home-side">
        <section class="panel hero-panel" id="hero-panel" aria-label="Hero"></section>
        <section class="panel panel-tilt-left add-panel" id="add-panel" aria-labelledby="add-title">
          <h2 id="add-title" class="panel-title" data-i18n="addTitle">New item!</h2>
          <form id="add-form" class="bubble" novalidate>
            <label class="field">
              <span data-i18n="fieldName">Name</span>
              <input type="text" name="name" required maxlength="200" autocomplete="off" />
            </label>
            <label class="field">
              <span data-i18n="fieldCategory">Category</span>
              <select name="category" id="category-select"></select>
            </label>
            <label class="field">
              <span data-i18n="fieldDescription">Description (URLs become links)</span>
              <textarea name="description" rows="3" maxlength="2000"></textarea>
            </label>
            <label class="field field-check">
              <input type="checkbox" name="daily" />
              <span data-i18n="fieldDaily">Every day</span>
            </label>
            <p class="form-error" id="form-error" role="alert" hidden></p>
            <button type="submit" class="stamp stamp-big" data-i18n="addButton">ADD!</button>
          </form>
        </section>
      </aside>

      <section class="home-content">
        <nav class="game-tabs" aria-label="Sections">
          <button type="button" class="tab" data-tab="list" data-i18n="tabList">List</button>
          <button type="button" class="tab" data-tab="today" data-game-i18n="tabToday">Today</button>
          <button type="button" class="tab" data-tab="sheet" data-game-i18n="tabSheet">Sheet</button>
        </nav>
        <p class="game-notice form-error" id="game-notice" role="status" hidden></p>

        <div id="list-section">
          <section class="panel panel-tilt-right filters-panel" aria-label="Filters">
            <div class="category-tabs" id="category-tabs" role="tablist"></div>
            <div class="filters-row">
              <input
                type="search"
                id="search-input"
                class="search-input"
                data-i18n-placeholder="searchPlaceholder"
                placeholder="Search..."
              />
              <select id="status-select" class="status-select">
                <option value="all" data-i18n="statusAll">All</option>
                <option value="todo" data-i18n="statusTodo">To do</option>
                <option value="done" data-i18n="statusDone">Done</option>
              </select>
            </div>
            <p class="counter" id="counter"></p>
          </section>
          <section class="items-grid" id="items-grid" aria-live="polite"></section>
          <p class="empty-state panel" id="empty-state" hidden data-i18n="empty">Nothing here... yet.</p>
        </div>
        <div id="hero-main" hidden></div>
      </section>
    </main>

    <footer class="colophon">
      <span data-i18n="footer">Saved in this browser only. Export to keep a copy.</span>
    </footer>

    <script type="module" src="js/app.js"></script>
  </body>
</html>
